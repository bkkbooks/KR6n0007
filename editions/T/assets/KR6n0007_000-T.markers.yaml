  - {type: variant, offset: 8404, length: 421, content: 二＝有四一【甲】二【大】，有四一【甲】二有四一、明總中小大無量；三明＝二明別【甲】三明【大】，二明別【甲】三、明二明別中小大無量；三、明齊何名得；四、明通達及得。初中，景、備同云：經說別法止觀復說緣總法止觀者，於十二部經別緣一一部經隨順真如等修於止觀名緣別法，若總十二部經思惟此法隨順真如等名緣總法。今解：於一一部內但緣小分名＝明【甲】名【大】，明【甲】名明緣別法，若緣全部乃至具緣十二部名緣總法。言隨順趣向修入者，如次配聞思修慧也，若約位說，隨順是迴向已下，趣向是煖頂忍，修入是世第一法，修入初故也。次明小大無量，謂緣一部教法入真如總觀名緣小總法。若緣一分齊中十二部經名緣大總法，以十二部有眾多義，即如法華經自說一種十二部法，涅槃經中後＝復【甲】後【大】，復【甲】後復說一種十二部界。華嚴經復說：一種十二部事，故云若緣無量如來法教等隨順真如觀名緣無量總法止觀。第三明齊何名得緣總法止觀。問意齊何名得緣彼真如總法止觀，下答由五緣故，當知名得者，即舉十地中五修所得五果以為五緣，由具此緣名得緣總真如法也；無著菩薩取此處文。攝論中說：何等五修？云何五果？一、集總修；二、無相修；三、無功用修；四、修熾盛修；五、無喜足修。如此五修論體不異，於一念中隨義＝意【甲】義【大】，意【甲】義意說五，謂集一切總為一聚簡要修習唯觀真如，即集總修為簡骨瑣事境總觀闕慧貞《注解深密經一處錯簡》, 大: ''}
